name: Build Android TWA (bubblewrap)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install bubblewrap
        run: |
          npm install -g @bubblewrap/cli

      - name: Build TWA
        run: |
          yes | npx bubblewrap init \
            --manifest=https://qariclinic.github.io/azan_watch_package_v2/manifest.json \
            --packageId=com.qariclinic.azanwatch \
            --path=twa-output \
            --manifestVersionCode=1 \
            --skipPwaValidation
          cd twa-output
          yes | npx bubblewrap build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twa-output
          path: twa-output
